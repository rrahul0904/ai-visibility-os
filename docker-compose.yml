services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visibility
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - visibility_pg:/var/lib/postgresql/data
      - ./packages/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visibility"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/visibility
      INTERNAL_JOB_SECRET: local-dev
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/visibility
    depends_on:
      db:
        condition: service_healthy

volumes:
  visibility_pg:
